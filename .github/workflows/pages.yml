# Builds dist/index.html from src/ and publishes it to GitHub Pages on every push to master.
name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # keep the deployments list tidy: after a successful deploy, drop every older github-pages deployment
      - name: Remove old deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deps = await github.paginate(github.rest.repos.listDeployments, { owner, repo, environment: 'github-pages' });
            for (const d of deps.slice(1)) {   // newest first: keep the one just made
              await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: d.id, state: 'inactive' });
              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id });
            }
